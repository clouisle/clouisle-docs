<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Upgrade rollout status</title><desc id="d">A safe Clouisle upgrade sequence checks backups, migrations, service health, and smoke requests before completion.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#52616b}.b{fill:#fff;stroke:#2091B2;stroke-width:2;rx:14}.ok{fill:#eaf8f1;stroke:#22a06b;stroke-width:2;rx:14}.n{font-size:20px;font-weight:600}.u{font-size:14px;fill:#52616b}.e{stroke:#2091B2;stroke-width:3;fill:none}</style><rect width="1200" height="560" fill="#f8fafb"/><text x="55" y="60" class="h">Upgrade rollout status</text><text x="55" y="90" class="s">Keep the migration checkpoint visible before rolling out workers and frontend</text><g transform="translate(60 155)"><rect class="ok" width="200" height="100"/><text class="n" x="100" y="198" text-anchor="middle">Backup</text><text class="u" x="100" y="225" text-anchor="middle">PostgreSQL · Qdrant</text><rect class="ok" x="250" width="200" height="100"/><text class="n" x="350" y="43" text-anchor="middle">API + migration</text><text class="u" x="350" y="70" text-anchor="middle">health endpoint</text><rect class="ok" x="500" width="200" height="100"/><text class="n" x="600" y="43" text-anchor="middle">Workers + Beat</text><text class="u" x="600" y="70" text-anchor="middle">Beat stays 1 replica</text><rect class="ok" x="750" width="200" height="100"/><text class="n" x="850" y="43" text-anchor="middle">Frontend</text><text class="u" x="850" y="70" text-anchor="middle">route and login</text><path class="e" d="M200 50h50M450 50h50M700 50h50"/></g><rect class="b" x="60" y="340" width="890" height="110"/><text class="n" x="90" y="380">Completion checks</text><text class="u" x="90" y="415">/api/v1/health · login · model list · Knowledge Base retrieval · published Agent · existing Workflow</text><rect class="b" x="990" y="340" width="150" height="110"/><text class="n" x="1065" y="385" text-anchor="middle">Rollback</text><text class="u" x="1065" y="420" text-anchor="middle">verify migration</text></svg>
