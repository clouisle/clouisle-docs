<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Backup and recovery checklist</title><desc id="d">Ordered recovery sequence for PostgreSQL, Qdrant, uploads, secrets, services, and smoke checks.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#52616b}.b{fill:#fff;stroke:#2091B2;stroke-width:2;rx:14}.num{fill:#2091B2}.nt{font-size:20px;font-weight:700;fill:#fff}.n{font-size:20px;font-weight:600}.u{font-size:14px;fill:#52616b}.e{stroke:#2091B2;stroke-width:3;fill:none}</style><rect width="1200" height="620" fill="#f8fafb"/><text x="55" y="60" class="h">Backup and recovery checklist</text><text x="55" y="90" class="s">Restore one consistent recovery point across metadata, vectors, files, and secrets</text><g transform="translate(60 135)"><g><rect class="b" width="500" height="62"/><circle class="num" cx="32" cy="31" r="21"/><text class="nt" x="32" y="38" text-anchor="middle">1</text><text class="n" x="70" y="38">PostgreSQL + extensions</text></g><g transform="translate(0 78)"><rect class="b" width="500" height="62"/><circle class="num" cx="32" cy="31" r="21"/><text class="nt" x="32" y="38" text-anchor="middle">2</text><text class="n" x="70" y="38">Qdrant collections + uploads</text></g><g transform="translate(0 156)"><rect class="b" width="500" height="62"/><circle class="num" cx="32" cy="31" r="21"/><text class="nt" x="32" y="38" text-anchor="middle">3</text><text class="n" x="70" y="38">SECRET_KEY + environment</text></g><g transform="translate(0 234)"><rect class="b" width="500" height="62"/><circle class="num" cx="32" cy="31" r="21"/><text class="nt" x="32" y="38" text-anchor="middle">4</text><text class="n" x="70" y="38">API, workers, sandbox, beat</text></g><g transform="translate(0 312)"><rect class="b" width="500" height="62"/><circle class="num" cx="32" cy="31" r="21"/><text class="nt" x="32" y="38" text-anchor="middle">5</text><text class="n" x="70" y="38">Health + retrieval + smoke run</text></g></g><path class="e" d="M310 197v16M310 275v16M310 353v16M310 431v16"/><rect class="b" x="650" y="190" width="450" height="220"/><text class="n" x="680" y="235">Do not restore only one layer</text><text class="u" x="680" y="275">PostgreSQL without files or vectors</text><text class="u" x="680" y="305">leaves resources incomplete.</text><text class="u" x="680" y="350">Qdrant without matching metadata</text><text class="u" x="680" y="380">leaves vectors unreferenced.</text></svg>
