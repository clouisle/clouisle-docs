<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Clouisle API error response</title><desc id="d">An HTTP error response contains a status and a JSON body with code, data, and message fields.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#52616b}.b{fill:#fff;stroke:#2091B2;stroke-width:2;rx:14}.k{fill:#eaf6f8;stroke:#2091B2;stroke-width:2;rx:8}.n{font-size:20px;font-weight:600}.u{font-size:16px;fill:#52616b}.code{font-family:ui-monospace,Menlo,monospace;font-size:21px}</style><rect width="1200" height="560" fill="#f8fafb"/><text x="55" y="60" class="h">Unified API error response</text><text x="55" y="90" class="s">Clients inspect the HTTP status and the JSON code/data/msg envelope</text><rect class="b" x="60" y="145" width="1080" height="330"/><text x="95" y="190" class="n">HTTP/1.1 422 Unprocessable Entity</text><rect class="k" x="95" y="225" width="1010" height="205"/><text class="code" x="125" y="270">{</text><text class="code" x="160" y="310">"code": 422,</text><text class="code" x="160" y="350">"data": { "field": "message", "reason": "required" },</text><text class="code" x="160" y="390">"msg": "Validation failed"</text><text class="code" x="125" y="430">}</text></svg>
