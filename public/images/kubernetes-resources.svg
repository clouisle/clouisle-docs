<rect width="1200" height="760" fill="#f8fafb"/><text x="50" y="54" font-size="30" font-weight="700">Kubernetes resources and Ingress</text><text x="50" y="82" class="u">Schematic derived from the Clouisle Helm and fallback manifests</text>
