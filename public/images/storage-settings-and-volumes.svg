<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Storage settings and deployment volumes</title><desc id="d">Clouisle storage can use local volumes or object storage. Compose volumes persist PostgreSQL, Redis, Qdrant, and uploads.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#52616b}.b{fill:#fff;stroke:#2091B2;stroke-width:2;rx:14}.p{fill:#eff9fb;stroke:#2091B2;stroke-width:2;rx:14}.n{font-size:20px;font-weight:600}.u{font-size:15px;fill:#52616b}.e{stroke:#2091B2;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2091B2"/></marker></defs><rect width="1200" height="560" fill="#f8fafb"/><text x="55" y="60" class="h">Storage settings and deployment volumes</text><text x="55" y="90" class="s">Choose local storage for a single API replica or object storage for shared multi-replica deployments</text><rect class="b" x="60" y="150" width="480" height="145"/><text class="n" x="90" y="195">Local file system</text><text class="u" x="90" y="230">Compose: uploads_data</text><text class="u" x="90" y="260">Requires shared ReadWriteMany for API replicas</text><rect class="b" x="660" y="150" width="480" height="145"/><text class="n" x="690" y="195">Object storage</text><text class="u" x="690" y="230">Endpoint · bucket · region · credentials</text><text class="u" x="690" y="260">Suitable for shared multi-node access</text><path class="e" d="M540 220h120"/><rect class="p" x="60" y="375" width="240" height="80"/><text class="n" x="180" y="410" text-anchor="middle">postgres_data</text><text class="u" x="180" y="435" text-anchor="middle">metadata + search</text><rect class="p" x="350" y="375" width="240" height="80"/><text class="n" x="470" y="410" text-anchor="middle">redis_data</text><text class="u" x="470" y="435" text-anchor="middle">queue + cache</text><rect class="p" x="640" y="375" width="240" height="80"/><text class="n" x="760" y="410" text-anchor="middle">qdrant_data</text><text class="u" x="760" y="435" text-anchor="middle">vector collections</text><rect class="p" x="930" y="375" width="210" height="80"/><text class="n" x="1035" y="410" text-anchor="middle">uploads_data</text><text class="u" x="1035" y="435" text-anchor="middle">files + artifacts</text></svg>
