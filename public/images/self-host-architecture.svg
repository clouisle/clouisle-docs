<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Clouisle self-host deployment architecture</title>
<desc id="desc">Browser traffic passes through an external proxy to frontend and API. API dispatches tasks to worker and sandbox-worker, while API and workers use PostgreSQL, Redis, and Qdrant.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2091B2"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b} .box{fill:#fff;stroke:#2091B2;stroke-width:2;rx:14} .store{fill:#eff9fb;stroke:#2091B2;stroke-width:2;rx:14} .label{font-size:20px;font-weight:600}.sub{font-size:14px;fill:#52616b}.edge{stroke:#2091B2;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style></defs>
<rect width="1200" height="700" fill="#f8fafb"/>
<text x="60" y="62" font-size="30" font-weight="700">Clouisle self-host deployment architecture</text>
<text x="60" y="92" class="sub">Request routing and asynchronous task relationships</text>
<rect class="box" x="60" y="270" width="150" height="76"/><text class="label" x="135" y="304" text-anchor="middle">Browser</text><text class="sub" x="135" y="328" text-anchor="middle">HTTP / SSE</text>
<rect class="box" x="280" y="270" width="190" height="76"/><text class="label" x="375" y="304" text-anchor="middle">Reverse proxy</text><text class="sub" x="375" y="328" text-anchor="middle">/api/* and /</text>
<rect class="box" x="540" y="160" width="180" height="76"/><text class="label" x="630" y="194" text-anchor="middle">frontend</text><text class="sub" x="630" y="218" text-anchor="middle">:3000</text>
<rect class="box" x="540" y="290" width="180" height="76"/><text class="label" x="630" y="324" text-anchor="middle">api</text><text class="sub" x="630" y="348" text-anchor="middle">:8000</text>
<rect class="box" x="540" y="455" width="180" height="76"/><text class="label" x="630" y="489" text-anchor="middle">worker</text><text class="sub" x="630" y="513" text-anchor="middle">Celery tasks</text>
<rect class="box" x="800" y="455" width="180" height="76"/><text class="label" x="890" y="489" text-anchor="middle">sandbox-worker</text><text class="sub" x="890" y="513" text-anchor="middle">isolated jobs</text>
<rect class="box" x="800" y="290" width="180" height="76"/><text class="label" x="890" y="324" text-anchor="middle">beat</text><text class="sub" x="890" y="348" text-anchor="middle">scheduled tasks</text>
<rect class="store" x="540" y="610" width="180" height="60"/><text class="label" x="630" y="647" text-anchor="middle">PostgreSQL</text>
<rect class="store" x="800" y="610" width="180" height="60"/><text class="label" x="890" y="647" text-anchor="middle">Redis</text>
<rect class="store" x="1020" y="610" width="140" height="60"/><text class="label" x="1090" y="647" text-anchor="middle">Qdrant</text>
<path class="edge" d="M210 308H280"/><path class="edge" d="M470 290L540 210"/><path class="edge" d="M470 325H540"/><path class="edge dash" d="M630 366V455"/><path class="edge dash" d="M720 328H800"/><path class="edge dash" d="M720 500H800"/><path class="edge dash" d="M890 366V455"/><path class="edge dash" d="M630 531V610"/><path class="edge dash" d="M720 500L800 635"/><path class="edge dash" d="M890 531V610"/><path class="edge dash" d="M980 635H1020"/><path class="edge dash" d="M720 340L1020 635"/>
<text x="60" y="145" class="sub">Solid: browser request path · Dashed: task, queue, persistence, or vector-index dependency</text>
</svg>
