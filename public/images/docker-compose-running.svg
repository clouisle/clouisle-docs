<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Docker Compose services running</title><desc id="d">Clouisle Compose services and their healthy status.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#52616b}.b{fill:#fff;stroke:#2091B2;stroke-width:2;rx:12}.ok{fill:#eaf8f1;stroke:#22a06b;stroke-width:2;rx:12}.n{font-size:21px;font-weight:600}.sub{font-size:14px;fill:#52616b}</style><rect width="1200" height="620" fill="#f8fafb"/><text x="55" y="60" class="h">docker compose ps</text><text x="55" y="90" class="s">Sanitized readiness snapshot · all required Clouisle services healthy</text><g transform="translate(55 135)"><rect class="b" width="1090" height="55"/><text x="24" y="35" class="n">SERVICE</text><text x="330" y="35" class="n">ROLE</text><text x="930" y="35" class="n">STATUS</text><g transform="translate(0 70)"><rect class="ok" width="1090" height="48"/><text x="24" y="31" class="n">frontend</text><text x="330" y="31" class="sub">Web application</text><text x="930" y="31" class="n">healthy</text></g><g transform="translate(0 130)"><rect class="ok" width="1090" height="48"/><text x="24" y="31" class="n">api</text><text x="330" y="31" class="sub">HTTP API</text><text x="930" y="31" class="n">healthy</text></g><g transform="translate(0 190)"><rect class="ok" width="1090" height="48"/><text x="24" y="31" class="n">worker</text><text x="330" y="31" class="sub">Async jobs</text><text x="930" y="31" class="n">healthy</text></g><g transform="translate(0 250)"><rect class="ok" width="1090" height="48"/><text x="24" y="31" class="n">sandbox-worker</text><text x="330" y="31" class="sub">Isolated execution</text><text x="930" y="31" class="n">healthy</text></g><g transform="translate(0 310)"><rect class="ok" width="1090" height="48"/><text x="24" y="31" class="n">beat</text><text x="330" y="31" class="sub">Scheduled tasks</text><text x="930" y="31" class="n">running</text></g><g transform="translate(0 370)"><rect class="ok" width="1090" height="48"/><text x="24" y="31" class="n">db · redis · qdrant</text><text x="330" y="31" class="sub">Persistence, queue, vector index</text><text x="930" y="31" class="n">healthy</text></g></g></svg>
