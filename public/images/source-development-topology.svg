<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Source development topology</title><desc id="d">Local development processes for frontend, API, workers, and data services.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#52616b}.b{fill:#fff;stroke:#2091B2;stroke-width:2;rx:14}.p{fill:#eff9fb;stroke:#2091B2;stroke-width:2;rx:14}.n{font-size:21px;font-weight:600}.u{font-size:15px;fill:#52616b}.e{stroke:#2091B2;stroke-width:3;fill:none}</style><rect width="1200" height="620" fill="#f8fafb"/><text x="55" y="60" class="h">Local source development topology</text><text x="55" y="90" class="s">Run application processes locally; keep PostgreSQL, Redis, and Qdrant in Compose</text><rect class="b" x="60" y="170" width="220" height="100"/><text x="170" y="210" text-anchor="middle" class="n">frontend</text><text x="170" y="238" text-anchor="middle" class="u">Bun · Next.js · :3000</text><rect class="b" x="350" y="170" width="220" height="100"/><text x="460" y="210" text-anchor="middle" class="n">api</text><text x="460" y="238" text-anchor="middle" class="u">uvicorn · :8000</text><rect class="b" x="640" y="170" width="220" height="100"/><text x="750" y="210" text-anchor="middle" class="n">worker + beat</text><text x="750" y="238" text-anchor="middle" class="u">Celery processes</text><rect class="b" x="930" y="170" width="210" height="100"/><text x="1035" y="210" text-anchor="middle" class="n">sandbox-worker</text><text x="1035" y="238" text-anchor="middle" class="u">isolated jobs</text><rect class="p" x="200" y="410" width="220" height="90"/><text x="310" y="448" text-anchor="middle" class="n">PostgreSQL</text><text x="310" y="475" text-anchor="middle" class="u">metadata + search</text><rect class="p" x="490" y="410" width="220" height="90"/><text x="600" y="448" text-anchor="middle" class="n">Redis</text><text x="600" y="475" text-anchor="middle" class="u">queue + cache</text><rect class="p" x="780" y="410" width="220" height="90"/><text x="890" y="448" text-anchor="middle" class="n">Qdrant</text><text x="890" y="475" text-anchor="middle" class="u">vector index</text><path class="e" d="M280 220h70M570 220h70M860 220h70M460 270l-120 140M520 270l70 140M750 270l-150 140M800 270l90 140"/></svg>
